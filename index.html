<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>اسلایدر رولینگ برای المنتور — دموی زنده</title>
    <meta name="description" content="Live demo of Rolling Slider for Elementor in Persian and English: 14 slide transitions, grid navigation tabs and RTL/LTR from the WordPress language.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Rolling Slider for Elementor — Live demo">
    <meta property="og:description" content="Full-width Elementor slider with 14 transitions, grid navigation tabs, and Persian/English with RTL/LTR from the WordPress language.">
    <meta property="og:url" content="https://saeedamini144.github.io/rolling-slider-elementor/">

    <!-- همان CSS و JS خودِ افزونه -->
    <link rel="stylesheet" href="rolling-slider-elementor/assets/css/rolling-slider.css">

    <style>
        :root {
            --bg: #07121f;
            --bg2: #0b1a2c;
            --card: #0f2036;
            --line: rgba(255, 255, 255, .1);
            --tx: #eaf0f7;
            --mu: #9db0c6;
            --ac: #f2a736;
            --w: 1180px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: "Vazirmatn", system-ui, sans-serif;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        button,
        select,
        input {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 3px;
        }

        /* ── نوار بالا (روی اسلایدر) ── */
        .dm-top {
            position: absolute;
            top: 0;
            inset-inline: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px clamp(16px, 4vw, 40px);
        }

        .dm-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 800;
            text-decoration: none;
        }

        .dm-brand i {
            display: block;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--ac), #ffd089);
        }

        .dm-seg {
            display: inline-flex;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 999px;
            background: rgba(9, 22, 37, .55);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        .dm-seg button {
            padding: 5px 14px;
            border: 0;
            border-radius: 999px;
            background: none;
            color: rgba(255, 255, 255, .75);
            font-size: .88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .dm-seg button[aria-pressed="true"] {
            background: var(--ac);
            color: #1b1200;
        }

        #hero {
            min-height: 100vh;
            min-height: 100svh;
        }

        /* فقط برای تصاویر دمو: در چپ‌چین نقطهٔ روشن صحنه پشت متن نیفتد
           (ویژگی scale جدا از transform است، پس با Ken Burns و افکت‌ها تداخل ندارد) */
        #hero[dir="ltr"] .rsl__media {
            scale: -1 1;
        }

        [dir="rtl"] .dm-arr {
            transform: scaleX(-1);
        }

        /* ── پنل تنظیمات ── */
        .dm-sec {
            padding: clamp(48px, 7vw, 88px) 0;
        }

        .dm-wrap {
            width: min(100% - 32px, var(--w));
            margin-inline: auto;
        }

        .dm-head {
            max-width: 46rem;
            margin-bottom: 28px;
        }

        .dm-kicker {
            color: var(--ac);
            font-size: .85rem;
            font-weight: 700;
        }

        .dm-head h2 {
            margin: .2em 0 .4em;
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            line-height: 1.4;
        }

        .dm-head p {
            margin: 0;
            color: var(--mu);
        }

        .dm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 16px;
        }

        .dm-card {
            min-width: 0;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--card);
        }

        .dm-card--wide {
            grid-column: 1 / -1;
        }

        .dm-card h3 {
            margin: 0 0 12px;
            font-size: 1rem;
        }

        .dm-note {
            margin: 12px 0 0;
            color: var(--mu);
            font-size: .85rem;
        }

        .dm-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dm-chip {
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, .04);
            font-size: .86rem;
            cursor: pointer;
            transition: border-color .2s, background-color .2s;
        }

        .dm-chip:hover {
            border-color: rgba(255, 255, 255, .35);
        }

        .dm-chip[aria-pressed="true"] {
            border-color: var(--ac);
            background: var(--ac);
            color: #1b1200;
            font-weight: 600;
        }

        .dm-range {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dm-range input {
            flex: 1;
            min-width: 0;
            accent-color: var(--ac);
        }

        .dm-range output {
            min-width: 6.5em;
            font-variant-numeric: tabular-nums;
            text-align: end;
        }

        .dm-card select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bg2);
        }

        .dm-card select option {
            background: var(--bg2);
        }

        .dm-foot {
            padding: 24px 0;
            border-top: 1px solid var(--line);
            color: var(--mu);
            font-size: .88rem;
        }

        .dm-foot .dm-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 20px;
        }

        .dm-foot nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
        }

        .dm-foot a {
            color: var(--tx);
        }
    </style>
</head>

<body>

    <header class="dm-top">
        <a class="dm-brand" href="about.html"><i aria-hidden="true"></i><span data-t="brand">اسلایدر رولینگ</span></a>
        <div class="dm-seg" role="group" data-ta="aria-label:langLabel" aria-label="زبان">
            <button type="button" data-lang="fa" lang="fa" aria-pressed="true">فارسی</button>
            <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
        </div>
    </header>

    <main>
        <!-- دقیقاً همان مارک‌آپی که ویجت در سایت چاپ می‌کند (render در class-widget.php) -->
        <section id="hero" class="rsl rsl--veil-start rsl--hover-icon rsl--kenburns" dir="rtl"
            aria-roledescription="carousel" data-ta="aria-label:sliderLabel" aria-label="دموی اسلایدر رولینگ"
            data-fx="cover" data-autoplay="yes" data-duration="6500" data-pause-hover="yes" data-swipe="yes"
            style="--rsl-duration:6500ms;--rsl-speed:1100ms;--rsl-n:4;--rsl-n-m:3;">

            <div class="rsl__stage" aria-hidden="true">
                <div class="rsl__slide rsl-t--cover is-active" data-fx="cover"><img class="rsl__media" src="demo/scene-1.svg" alt="" width="1600" height="900" loading="eager" fetchpriority="high" decoding="async"></div>
                <div class="rsl__slide rsl-t--cover" data-fx="cover"><img class="rsl__media" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-rsl-src="demo/scene-2.svg" alt="" width="1600" height="900" decoding="async"></div>
                <div class="rsl__slide rsl-t--cover" data-fx="cover"><img class="rsl__media" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-rsl-src="demo/scene-3.svg" alt="" width="1600" height="900" decoding="async"></div>
                <div class="rsl__slide rsl-t--cover" data-fx="cover"><img class="rsl__media" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-rsl-src="demo/scene-4.svg" alt="" width="1600" height="900" decoding="async"></div>
            </div>

            <span class="rsl__veil" aria-hidden="true"></span>

            <div class="rsl__body">
                <div class="rsl__panels">

                    <div class="rsl__panel is-active" id="rsl-panel-0" role="tabpanel" aria-labelledby="rsl-tab-0">
                        <span class="rsl__eyebrow rsl-fx rsl-fx--fade-up" data-t="s1Eyebrow"></span>
                        <h1 class="rsl__title rsl-fx rsl-fx--fade-up" style="--rsl-delay:80ms" data-th="s1Title"></h1>
                        <div class="rsl__content rsl-fx rsl-fx--fade-up" style="--rsl-delay:160ms"><p data-t="s1Text"></p></div>
                        <div class="rsl__actions rsl-fx rsl-fx--fade-up" style="--rsl-delay:240ms">
                            <a class="rsl__btn rsl__btn--primary" href="#controls"><span class="rsl__btn-text" data-t="s1Btn"></span><span class="rsl__btn-icon"><svg class="dm-arr" aria-hidden="true"><use href="#i-arr" /></svg></span></a>
                            <a class="rsl__btn rsl__btn--ghost" href="rolling-slider-elementor.zip" download><span class="rsl__btn-text" data-t="dl"></span><span class="rsl__btn-icon"><svg aria-hidden="true"><use href="#i-dl" /></svg></span></a>
                        </div>
                    </div>

                    <div class="rsl__panel" id="rsl-panel-1" role="tabpanel" aria-labelledby="rsl-tab-1">
                        <span class="rsl__eyebrow rsl-fx rsl-fx--fade-up" data-t="s2Eyebrow"></span>
                        <h2 class="rsl__title rsl-fx rsl-fx--fade-up" style="--rsl-delay:80ms" data-th="s2Title"></h2>
                        <div class="rsl__content rsl-fx rsl-fx--fade-up" style="--rsl-delay:160ms"><p data-t="s2Text"></p></div>
                        <div class="rsl__actions rsl-fx rsl-fx--fade-up" style="--rsl-delay:240ms">
                            <a class="rsl__btn rsl__btn--primary" href="#" data-action="toggle-lang"><span class="rsl__btn-text" data-t="s2Btn"></span><span class="rsl__btn-icon"><svg aria-hidden="true"><use href="#i-globe" /></svg></span></a>
                        </div>
                    </div>

                    <div class="rsl__panel" id="rsl-panel-2" role="tabpanel" aria-labelledby="rsl-tab-2">
                        <span class="rsl__eyebrow rsl-fx rsl-fx--fade-up" data-t="s3Eyebrow"></span>
                        <h2 class="rsl__title rsl-fx rsl-fx--fade-up" style="--rsl-delay:80ms" data-th="s3Title"></h2>
                        <div class="rsl__content rsl-fx rsl-fx--fade-up" style="--rsl-delay:160ms"><p data-t="s3Text"></p></div>
                        <div class="rsl__actions rsl-fx rsl-fx--fade-up" style="--rsl-delay:240ms">
                            <a class="rsl__btn rsl__btn--primary" href="#controls"><span class="rsl__btn-text" data-t="s3Btn"></span><span class="rsl__btn-icon"><svg class="dm-arr" aria-hidden="true"><use href="#i-arr" /></svg></span></a>

                        </div>
                    </div>

                </div>
            </div>

                <div class="rsl__tabs" role="tablist" data-ta="aria-label:sliderLabel" aria-label="دموی اسلایدر رولینگ">
                    <button class="rsl__tab" type="button" role="tab" id="rsl-tab-0" aria-controls="rsl-panel-0" aria-selected="true" tabindex="0" data-t="s1Tab"></button>
                    <button class="rsl__tab" type="button" role="tab" id="rsl-tab-1" aria-controls="rsl-panel-1" aria-selected="false" tabindex="-1" data-t="s2Tab"></button>
                    <button class="rsl__tab" type="button" role="tab" id="rsl-tab-2" aria-controls="rsl-panel-2" aria-selected="false" tabindex="-1" data-t="s3Tab"></button>
                    <button class="rsl__tab" type="button" role="tab" id="rsl-tab-3" aria-controls="rsl-panel-3" aria-selected="false" tabindex="-1" data-t="s4Tab"></button>
                </div>
            </div>
        </section>

        <section id="controls" class="dm-sec">
            <div class="dm-wrap">
                <div class="dm-head">
                    <span class="dm-kicker" data-t="ctlKicker"></span>
                    <h2 data-t="ctlTitle"></h2>
                    <p data-t="ctlLead"></p>
                </div>

                <div class="dm-grid">
                    <div class="dm-card dm-card--wide">
                        <h3 data-t="cardFx"></h3>
                        <div class="dm-chips" id="dm-fx" role="group" data-ta="aria-label:cardFx"></div>
                        <p class="dm-note" data-t="hint"></p>
                    </div>

                    <div class="dm-card">
                        <h3 data-t="cardLang"></h3>
                        <div class="dm-chips" role="group" data-ta="aria-label:cardLang">
                            <button class="dm-chip" type="button" data-lang="fa" lang="fa" dir="rtl" aria-pressed="true">فارسی <bdi dir="ltr">fa_IR · RTL</bdi></button>
                            <button class="dm-chip" type="button" data-lang="en" lang="en" dir="ltr" aria-pressed="false">English <bdi>en_US · LTR</bdi></button>
                        </div>
                        <p class="dm-note" data-t="cardLangNote"></p>
                    </div>

                    <div class="dm-card">
                        <h3 data-t="cardCols"></h3>
                        <div class="dm-chips" id="dm-cols" role="group" data-ta="aria-label:cardCols"></div>
                        <p class="dm-note" data-t="colsNote"></p>
                    </div>

                    <div class="dm-card">
                        <h3><label for="dm-speed" data-t="cardSpeed"></label></h3>
                        <div class="dm-range">
                            <input id="dm-speed" type="range" min="300" max="2200" step="100" value="1100">
                            <output id="dm-speed-o" for="dm-speed"></output>
                        </div>
                    </div>

                    <div class="dm-card">
                        <h3><label for="dm-tfx" data-t="cardText"></label></h3>
                        <select id="dm-tfx"></select>
                    </div>
                </div>
            </div>
        </section>
    </main>

            var html = document.documentElement;
            var root = document.getElementById('hero');
            var slides = [].slice.call(root.querySelectorAll('.rsl__slide'));
            var fxBox = document.getElementById('dm-fx');
            var colsBox = document.getElementById('dm-cols');
            var speed = document.getElementById('dm-speed');
            var speedOut = document.getElementById('dm-speed-o');
            var tfxSel = document.getElementById('dm-tfx');
            var state = { lang: pickLang(), fx: 'cover', tfx: 'fade-up', cols: '' };

            function $$(sel, ctx) { return [].slice.call((ctx || document).querySelectorAll(sel)); }
            function num(n) { return state.lang === 'fa' ? String(n).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }) : String(n); }

            function pickLang() {
                var q = /[?&]lang=(fa|en)\b/.exec(location.search);
                if (q) return q[1];
                try { var s = localStorage.getItem('rsl-demo-lang'); if (s === 'fa' || s === 'en') return s; } catch (e) { /* ذخیره‌سازی در دسترس نیست */ }
                return 'fa';
            }

            function chip(label, pressed, onClick) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'dm-chip';
                b.textContent = label;
                b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
                b.addEventListener('click', onClick);
                return b;
            }

            // اسلاید بعدی را نشان بده تا تغییر همان لحظه دیده شود
            function playNext() {
                var tabs = $$('.rsl__tab', root);
                var cur = 0;
                tabs.forEach(function (t, i) { if (t.getAttribute('aria-selected') === 'true') cur = i; });
                tabs[(cur + 1) % tabs.length].click();
            }

            /* ── افکت تغییر اسلاید ── */
            function setSlideFx(slide, fx) {
                slide.className = slide.className.replace(/rsl-t--\S+/, 'rsl-t--' + fx);
                slide.setAttribute('data-fx', fx);
            }

            function applyFx(fx) {
                state.fx = fx;
                slides.forEach(function (s, i) { setSlideFx(s, fx === 'mix' ? MIX[i % MIX.length] : fx); });
                renderFx();
                playNext();
            }

            function renderFx() {
                var col = state.lang === 'fa' ? 2 : 1;
                fxBox.textContent = '';
                FX.forEach(function (f) {
                    fxBox.appendChild(chip(f[col], state.fx === f[0], function () { applyFx(f[0]); }));
                });
                fxBox.appendChild(chip(T[state.lang].mixed, state.fx === 'mix', function () { applyFx('mix'); }));
            }

            /* ── ستون‌های تب ── */
            function renderCols() {
                colsBox.textContent = '';
                COLS.forEach(function (c) {
                    colsBox.appendChild(chip(c ? num(c) : T[state.lang].auto, state.cols === c, function () {
                        state.cols = c;
                        if (c) root.style.setProperty('--rsl-cols', c);
                        else root.style.removeProperty('--rsl-cols');
                        renderCols();
                    }));
                });
            }

            /* ── افکت ورود متن ── */
            function renderTfx() {
                var col = state.lang === 'fa' ? 2 : 1;
                tfxSel.textContent = '';
                TFX.forEach(function (f) {
                    var o = document.createElement('option');
                    o.value = f[0];
                    o.textContent = f[col];
                    tfxSel.appendChild(o);
                });
                tfxSel.value = state.tfx;
            }

            tfxSel.addEventListener('change', function () {
                state.tfx = tfxSel.value;
                $$('.rsl-fx', root).forEach(function (el) {
                    el.className = el.className.replace(/rsl-fx--\S+/, 'rsl-fx--' + state.tfx);
                });
                playNext();
            });

            /* ── سرعت ── */
            function renderSpeed() { speedOut.textContent = num(speed.value) + ' ' + T[state.lang].ms; }
            speed.addEventListener('input', function () {
                root.style.setProperty('--rsl-speed', speed.value + 'ms');
                renderSpeed();
            });

            /* ── زبان: همان کاری که زبان وردپرس با ویجت می‌کند (متن + جهت) ── */
            function applyLang(lang) {
                var d = T[lang];
                var dir = lang === 'fa' ? 'rtl' : 'ltr';
                state.lang = lang;

                html.lang = lang;
                html.dir = dir;
                root.setAttribute('dir', dir);
                document.title = d.docTitle;

                $$('[data-t]').forEach(function (el) { el.textContent = d[el.getAttribute('data-t')]; });
                $$('[data-th]').forEach(function (el) { el.innerHTML = d[el.getAttribute('data-th')]; });
                $$('[data-ta]').forEach(function (el) {
                    var p = el.getAttribute('data-ta').split(':');
                    el.setAttribute(p[0], d[p[1]]);
                });
                $$('[data-lang]').forEach(function (b) {
                    b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
                });

                renderFx();
                renderCols();
                renderTfx();
                renderSpeed();

                try { localStorage.setItem('rsl-demo-lang', lang); } catch (e) { /* اختیاری */ }
                if (history.replaceState) history.replaceState(null, '', '?lang=' + lang + location.hash);
            }

            $$('[data-lang]').forEach(function (b) {
                b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
            });
            $$('[data-action="toggle-lang"]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    applyLang(state.lang === 'fa' ? 'en' : 'fa');
                });
            });

            applyLang(state.lang);
        })();
    </script>
